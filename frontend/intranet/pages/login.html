<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Elegância - Login</title>
</head>

<body>

    <header>
        <div>
            <span>PetShop Elegância</span>
        </div>
    </header>

    <main>

        <div id="login">
            
            <div id="page-title">
                <span>Login</span>
            </div>

            <div id="login-form">

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email">
                </div>

                <div>
                    <label for="password">Senha</label>
                    <input type="password" id="password">
                </div>

                <div>
                    <button type="button">Entrar</button>
                </div>

                <div>
                    <a href="#">Esqueci minha senha</a>
                </div>

            </div>

        </div>

    </main>

    <footer>
        <span>&copy; 2026 PetShop Elegância</span>
    </footer>

</body>
</html>
